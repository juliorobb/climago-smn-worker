name: Validate ClimaGo Worker

on:
  push:
    branches: [push-notifications-infra, integration/worker-cap-lifecycle]
  pull_request:
    branches: [main, push-notifications-infra]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npx wrangler deploy --dry-run
